  description: 'Kapucinus Kávézó is a premium specialty coffee shop and cafe in Hatvan, Hungary. The cafe serves coffee, breakfast, sandwiches, pastries, cakes, cold drinks and cocktails. The site needs a cafe menu page (food and drinks), an about page, a photo gallery, the venue location with a map, directions and opening hours, social media links, and a built-in admin for hero slides, menu items and gallery images.'
