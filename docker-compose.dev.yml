# LOCAL DEVELOPMENT ONLY — the hosting platform never reads this file.
# Run it explicitly:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:3000
#
# Production lives in docker-compose.yml and stays production-honest: the platform runs that
# file verbatim. Never move a local convenience into it, and never rename this file to
# docker-compose.override.yml — Compose would merge it into production automatically.
name: kapucinus-dev

services:
  web:
    build:
      context: .
      target: dev
    # Source is bind-mounted, so edits hot-reload without a rebuild. The two anonymous volumes
    # keep the image's node_modules and .next from being shadowed by the host directory —
    # without them a Linux-built dependency tree is replaced by the host's (or by nothing).
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      # Bind-mounted file events do not always reach the container natively on Windows and macOS.
      WATCHPACK_POLLING: 'true'
    # No env_file: Next.js loads .env.local itself from the mounted source, so local secrets stay
    # in one place. Development data lives in ./data inside the mounted source (git-ignored).
